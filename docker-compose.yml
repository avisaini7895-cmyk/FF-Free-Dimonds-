services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dimondtox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  web:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [db, redis]
volumes:
  postgres-data:
